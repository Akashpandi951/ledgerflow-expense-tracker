worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # High-Throughput TCP & Compression Tuning
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 10000;
    reset_timedout_connection on;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Shared 100MB Rate Limiting Zones (supports 1M+ unique client IPs)
    limit_req_zone $binary_remote_addr zone=api_limit:100m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:50m rate=15r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:50m;

    # Upstream Cluster with Least-Connections & Keepalive Socket Reuse
    upstream ledgerflow_backend {
        least_conn;
        keepalive 256;
        keepalive_requests 10000;
        keepalive_timeout 60s;
        server app1:4001 max_fails=3 fail_timeout=10s;
        server app2:4002 max_fails=3 fail_timeout=10s;
        server app3:4003 max_fails=3 fail_timeout=10s;
        server app4:4004 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80 reuseport;
        server_name localhost;
        limit_conn conn_limit 100;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Health Check (zero rate-limit overhead)
        location /health {
            proxy_pass http://ledgerflow_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Authentication Endpoints
        location /api/auth/ {
            limit_req zone=auth_limit burst=25 nodelay;
            proxy_pass http://ledgerflow_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # General API Endpoints
        location /api/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://ledgerflow_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # Static Client Assets with CDN-ready Cache Headers
        location ~* \.(css|js|svg|png|jpg|woff2)$ {
            proxy_pass http://ledgerflow_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            add_header Cache-Control "public, max-age=86400";
        }

        location / {
            proxy_pass http://ledgerflow_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
